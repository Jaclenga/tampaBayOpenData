name: live-check

"on":
  workflow_dispatch:
  schedule:
    # Twice weekly at 06:17 UTC, away from the busiest top-of-hour queues.
    - cron: '17 6 * * 2,5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Verify Tampa Bay public services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TAMPA_OPEN_DATA_LIVE: "true"
      TAMPA_OPEN_DATA_MODE: ${{ github.event_name == 'schedule' && 'monitoring' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Run opt-in live integration tests
        shell: Rscript {0}
        run: |
          test_filter <- if (identical(Sys.getenv("TAMPA_OPEN_DATA_MODE"), "monitoring")) {
            "live-monitoring|live-county-discovery"
          } else {
            "live"
          }
          testthat::test_local(filter = test_filter, stop_on_failure = TRUE)
