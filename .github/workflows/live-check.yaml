name: live-check

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Verify Tampa Bay public services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TAMPA_OPEN_DATA_LIVE: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Run opt-in live integration tests
        shell: Rscript {0}
        run: |
          testthat::test_local(filter = "live", stop_on_failure = TRUE)
