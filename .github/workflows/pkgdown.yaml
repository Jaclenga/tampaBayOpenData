# Based on https://github.com/r-lib/actions/blob/v2/examples/pkgdown.yaml
name: pkgdown

"on":
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: [catalog-health]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  pkgdown:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TAMPA_OPEN_DATA_LIVE: "false"
      TAMPA_OPEN_DATA_HEALTH_REPORT_DIR: ${{ github.workspace }}/.artifacts/catalog-health
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Restore latest catalog health report when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_ids=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            run_ids+=("${{ github.event.workflow_run.id }}")
          fi
          recent="$(timeout 30s gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow catalog-health.yaml --branch main --status success \
              --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          while IFS= read -r run_id; do
            if [[ -n "$run_id" ]]; then
              run_ids+=("$run_id")
            fi
          done <<< "$recent"
          shopt -s nullglob
          for run_id in "${run_ids[@]}"; do
            report_dir="$RUNNER_TEMP/catalog-health-report-$run_id"
            if ! timeout 90s gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "catalog-health-$run_id" --dir "$report_dir"; then
              continue
            fi
            reports=("$report_dir"/catalog-health-*.rds)
            if (( ${#reports[@]} > 0 )); then
              mkdir -p "$TAMPA_OPEN_DATA_HEALTH_REPORT_DIR"
              cp "$report_dir"/catalog-health-* "$TAMPA_OPEN_DATA_HEALTH_REPORT_DIR/"
              echo "Using catalog health report from workflow run $run_id."
              exit 0
            fi
          done
          echo "No catalog health report is available; building with unverified statuses."
      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(dest_dir = "_site", clean = TRUE, lazy = FALSE, new_process = FALSE, install = TRUE)
      - name: Verify generated homepage
        shell: Rscript {0}
        run: |
          expected <- yaml::read_yaml("_pkgdown.yml")$home$description
          index <- file.path("_site", "index.html")
          if (!file.exists(index) || !length(expected) || !nzchar(trimws(expected))) {
            stop("Missing generated homepage or source description")
          }
          html <- xml2::read_html(index)
          actual <- xml2::xml_attr(xml2::xml_find_first(html, ".//meta[@name='description']"), "content")
          normalize <- function(x) gsub("[[:space:]]+", " ", trimws(x))
          if (!identical(normalize(expected), normalize(actual))) {
            stop("Generated homepage description does not match _pkgdown.yml")
          }
      - name: Verify shared feedback navigation
        shell: Rscript {0}
        run: |
          feedback <- yaml::read_yaml("_pkgdown.yml")$navbar$components$feedback
          required <- file.path("_site", c("index.html",
            "articles/first-five-minutes.html", "articles/index.html",
            "reference/index.html", "reference/tbod_get_dataset.html",
            "articles/coverage.html", "news/index.html"))
          stopifnot(all(file.exists(required)))
          pages <- list.files("_site", pattern = "\\.html$", recursive = TRUE,
                              full.names = TRUE)
          checked <- 0L
          for (page in pages) {
            html <- xml2::read_html(page)
            navbar <- xml2::xml_find_all(html, ".//nav[@aria-label='Site navigation']")
            # pkgdown redirect pages have no navigation.
            if (!length(navbar) && !page %in% required) next
            links <- xml2::xml_find_all(navbar, ".//a")
            feedback_links <- links[trimws(xml2::xml_text(links)) == feedback$text]
            if (length(feedback_links) != 1L ||
                !identical(xml2::xml_attr(feedback_links, "href"), feedback$href)) {
              stop("Missing, duplicated, or incorrect feedback link in ", page)
            }
            checked <- checked + 1L
          }
          message("Verified shared feedback navigation on ", checked, " pages")
      - name: Verify main has not advanced
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$(git rev-parse HEAD)" != "$main_sha" ]]; then
            echo "::error::main advanced during this run; refusing to deploy an older site"
            exit 1
          fi
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: true
          branch: gh-pages
          folder: _site
