name: test-coverage

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Offline test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TAMPA_OPEN_DATA_LIVE: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Measure coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
          print(cov)
          percent <- covr::percent_coverage(cov)
          cat(sprintf("Offline test coverage: %.1f%%\n", percent))
          cat(
            "## Test coverage\n\n",
            sprintf("Offline test suite: **%.1f%%**\n\n", percent),
            "Live integration tests run separately in the live-check workflow.\n",
            file = Sys.getenv("GITHUB_STEP_SUMMARY"), sep = ""
          )
          if (percent < 75) {
            cat("::warning::Test coverage is below 75%; add tests or document the gap before rOpenSci submission.\n")
          }
          covr::to_cobertura(cov)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-coverage
          path: cobertura.xml
          if-no-files-found: ignore
      - name: Show test output
        if: always()
        shell: bash
        run: find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
