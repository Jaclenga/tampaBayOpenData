url: https://jaclenga.github.io/tampaBayOpenData/

home:
  title: Tampa Bay open data from R
  description: >
    Search six Tampa Bay ArcGIS publishers, retrieve a checked layer, or use
    another public ArcGIS portal or layer URL.

template:
  bootstrap: 5
  light-switch: true
  theme: github-light
  theme-dark: github-dark

navbar:
  structure:
    left: [intro, articles, reference, coverage, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/introduction.html
    articles:
      text: Articles
      menu:
        - text: Discovering data
          href: articles/discovery.html
        - text: Retrieving and downloading
          href: articles/retrieval.html
        - text: All articles
          href: articles/index.html
    coverage:
      text: Data coverage
      href: articles/coverage.html
    news:
      text: Changelog
      href: news/index.html

articles:
  - title: Start here
    desc: Find a layer and retrieve its records.
    contents:
      - introduction
  - title: In depth
    desc: Discovery, retrieval, and source limits.
    contents:
      - discovery
      - retrieval
      - coverage

reference:
  - title: Discover
    contents:
      - tbod_list_portals
      - tbod_list_datasets
      - tbod_search_datasets
      - tbod_discover
  - title: Inspect
    contents:
      - tbod_dataset_info
      - tbod_schema
      - tbod_check_schema
      - tbod_provenance
  - title: Retrieve
    contents:
      - tbod_get_dataset
      - tbod_get_arcgis_layer
  - title: Download
    contents:
      - tbod_download_dataset
      - tbod_download_arcgis_layer
  - title: Convenience functions
    contents:
      - tbod_get_permits
      - tbod_get_capital_projects
      - tbod_get_development_cases
