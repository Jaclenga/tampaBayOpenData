url: https://jaclenga.github.io/tampaBayOpenData/

home:
  title: Discover Tampa Bay and other public ArcGIS data
  description: >
    An R interface for six bundled Tampa Bay ArcGIS publishers and other public
    ArcGIS portals or layer URLs, with checked dataset IDs, schema checks,
    provenance, and spatial results.

template:
  bootstrap: 5
  light-switch: true
  theme: github-light
  theme-dark: github-dark

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Get started
      href: articles/introduction.html
    news:
      text: Changelog
      href: news/index.html

articles:
  - title: Start here
    desc: The basic path from discovery to a reproducible analysis.
    contents:
      - introduction
  - title: In depth
    desc: Search, retrieval, source coverage, and limitations.
    contents:
      - discovery
      - retrieval
      - coverage

reference:
  - title: Discover
    contents:
      - tbod_list_portals
      - tbod_list_datasets
      - tbod_search_datasets
      - tbod_discover
  - title: Inspect
    contents:
      - tbod_dataset_info
      - tbod_schema
      - tbod_check_schema
      - tbod_provenance
  - title: Retrieve
    contents:
      - tbod_get_dataset
      - tbod_get_arcgis_layer
  - title: Download
    contents:
      - tbod_download_dataset
      - tbod_download_arcgis_layer
  - title: Convenience functions
    contents:
      - tbod_get_permits
      - tbod_get_capital_projects
      - tbod_get_development_cases
  - title: Compatibility functions
    contents:
      - list_portals
      - list_datasets
      - search_datasets
      - dataset_info
      - dataset_provenance
      - get_dataset
      - get_arcgis_layer
      - download_dataset
      - download_arcgis_layer
      - get_permits
      - get_capital_projects
      - get_development_cases
